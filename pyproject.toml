[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi"
version = "0.9.0"
description = "Kalshi's public market data for binary event contracts in an Open Meridian deployment's lake: a data plugin"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else, pinned exactly: the sidecar this runs beside speaks
# one version of the contract, and a range would let a rebuild pick up
# another. The Dockerfile's base is the same version. Kalshi is reached with
# the standard library's HTTP client, so there is no third-party dependency.
dependencies = [
  "open-meridian==0.33.0",
]

[project.urls]
Repository = "https://github.com/open-meridian/plugin-kalshi"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
kalshi = "kalshi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The synthetic exchanges, installed beside the code that reads them.
[tool.setuptools.package-data]
kalshi = ["synthetic/*.json"]

# What this plugin says about itself, which `meridian plugin upload` sends and
# a deployment admin approves before it runs (W8). Declarations, not grants.
[tool.meridian]
# Roles from the deployment's fixed list -- compliance, confirmation,
# connectivity, custody, data, ems, oms, operations, portfolio, reporting,
# servicing, settlement, signal -- and its grants are theirs. `data`: it puts Kalshi's prices and quotes for
# binary event contracts into the lake, converted at the edge, and keeps
# Kalshi's raw responses in its own storage (W10, contract v19).
roles = ["data"]
# Whether it serves a page through its sidecar.
interface = true
# Its declaration: its catalogue, the storage it asks for its raw responses
# and its settings. Upload reads it from the built image with
# `meridian-declaration`.
declaration = "kalshi.declaration:DECLARATION"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kalshi"]
known-local-folder = ["venue_cases"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# The SDK's gRPC stubs have no types (meridian-python's own configuration
# says the same).
[[tool.mypy.overrides]]
module = [
    "meridian.v1.sidecar_pb2_grpc",
    "meridian.v1.envelope_pb2_grpc",
    "meridian.plugin.v1.operations_pb2_grpc",
]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
